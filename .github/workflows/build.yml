name: Build crDroid - Phoenix

on:
  workflow_dispatch:
    inputs:
      clean_ccache:
        description: 'Start fresh (ignore existing ccache backup)'
        required: false
        default: 'false'

env:
  BUILD_DIR: /mnt/build/crdroid
  CCACHE_DIR: /mnt/build/ccache
  DEVICE: phoenix
  BRANCH: "16.0"
  CCACHE_RELEASE_TAG: ccache-phoenix-backup
  BUILD_TIMEOUT_MIN: 320   # 5h20m compile budget, leaves room for setup/upload within 6h job limit

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:

      # ============ STEP 1: Free up disk space ============
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: '/mnt/build'

      - name: Disk space after cleanup
        run: df -h /mnt/build

      # ============ STEP 2: Install repo tool + deps ============
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev libncurses-dev libncurses6 lib32z1-dev \
            x11proto-core-dev libx11-dev libgl1-mesa-dev libxml2-utils xsltproc unzip \
            fontconfig python3 python-is-python3 rsync bc ccache

          # Older AOSP prebuilts expect libncurses5/libtinfo5 at runtime.
          # noble dropped these from the archive; try to fetch from old-releases
          # mirror, but never fail the job if unavailable - most modern branches
          # don't strictly need them.
          set +e
          for pkg_url in \
            "http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb" \
            "http://old-releases.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb"; do
            wget -q "$pkg_url" -O /tmp/libtinfo5.deb && sudo dpkg -i /tmp/libtinfo5.deb && break
          done
          for pkg_url in \
            "http://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb" \
            "http://old-releases.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2ubuntu0.1_amd64.deb"; do
            wget -q "$pkg_url" -O /tmp/libncurses5.deb && sudo dpkg -i /tmp/libncurses5.deb && break
          done
          sudo apt-get install -f -y
          rm -f /tmp/libtinfo5.deb /tmp/libncurses5.deb
          set -e
          echo "Legacy ncurses libs step done (non-fatal if unavailable)."

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      - name: Install GitHub CLI (for ccache release upload/download)
        run: |
          type gh >/dev/null 2>&1 || (sudo apt-get install -y gh)

      # ============ STEP 3: Restore ccache from previous run ============
      - name: Restore ccache from GitHub Release
        if: ${{ github.event.inputs.clean_ccache != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$CCACHE_DIR"
          echo "Checking for existing ccache backup..."
          if gh release view "$CCACHE_RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Found backup, downloading..."
            mkdir -p /tmp/ccache-restore
            gh release download "$CCACHE_RELEASE_TAG" --repo "${{ github.repository }}" -D /tmp/ccache-restore --clobber
            cat /tmp/ccache-restore/ccache-part-* > /tmp/ccache.tar.gz
            tar -xzf /tmp/ccache.tar.gz -C "$CCACHE_DIR"
            rm -rf /tmp/ccache-restore /tmp/ccache.tar.gz
            echo "Ccache restored: $(du -sh $CCACHE_DIR | cut -f1)"
          else
            echo "No existing ccache backup found, starting fresh."
          fi

      # ============ STEP 4: Sync only what's needed ============
      - name: Init repo (shallow, minimal)
        run: |
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR"
          repo init -u https://github.com/crdroidandroid/android.git \
            -b "$BRANCH" \
            --git-lfs \
            --no-clone-bundle \
            --depth=1

      - name: Add local manifest (device-specific repos only)
        run: |
          mkdir -p "$BUILD_DIR/.repo/local_manifests"
          cat > "$BUILD_DIR/.repo/local_manifests/phoenix.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="crdroidandroid/android_device_xiaomi_phoenix"
                     path="device/xiaomi/phoenix"
                     remote="github"
                     revision="16.0" />

            <project name="crdroidandroid/android_device_xiaomi_sm6150-common"
                     path="device/xiaomi/sm6150-common"
                     remote="github"
                     revision="16.0-phoenix" />

            <project name="crdroidandroid/android_kernel_xiaomi_sm6150"
                     path="kernel/xiaomi/sm6150"
                     remote="github"
                     revision="16.0" />

            <project name="crdroidandroid/proprietary_vendor_xiaomi_phoenix"
                     path="vendor/xiaomi/phoenix"
                     remote="github" />

            <project name="crdroidandroid/proprietary_vendor_xiaomi_sm6150-common"
                     path="vendor/xiaomi/sm6150-common"
                     remote="github"
                     revision="16.0-phoenix" />
          </manifest>
          EOF

      - name: Sync source (current branch only, shallow, no tags, minimal groups)
        run: |
          cd "$BUILD_DIR"
          repo sync -c \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            --force-sync \
            -g all,-notdefault,-darwin,-pdk \
            -j"$(nproc)"

      - name: Disk usage after sync (diagnostic - always runs, even on failure)
        if: always()
        run: |
          echo "===== DISK SPACE ====="
          df -h /mnt/build
          echo "===== TOP 20 LARGEST DIRS IN BUILD_DIR ====="
          du -sh "$BUILD_DIR"/* 2>/dev/null | sort -rh | head -20 || true

      # ============ STEP 5: Trim extra weight from synced source ============
      - name: Remove unnecessary bulk (docs, other-arch prebuilts, test data)
        run: |
          cd "$BUILD_DIR"
          # Darwin (Mac) host prebuilts - not needed on Linux runner
          rm -rf prebuilts/clang/host/darwin-x86 2>/dev/null || true
          rm -rf prebuilts/gcc/darwin-x86 2>/dev/null || true
          # CTS / test suites not needed for a personal build
          rm -rf cts 2>/dev/null || true
          # Docs
          rm -rf development/docs 2>/dev/null || true
          # Prebuilt emulator images (only relevant if you build emulator target)
          rm -rf prebuilts/qemu-kernel 2>/dev/null || true
          echo "Cleanup done."
          df -h /mnt/build

      # ============ STEP 6: Build ============
      - name: Setup ccache env
        run: |
          echo "USE_CCACHE=1" >> "$GITHUB_ENV"
          echo "CCACHE_EXEC=$(which ccache || echo /usr/bin/ccache)" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime" >> "$GITHUB_ENV"

      - name: Build (time-boxed)
        run: |
          cd "$BUILD_DIR"
          source build/envsetup.sh
          export USE_CCACHE=1
          export CCACHE_DIR="$CCACHE_DIR"
          export CCACHE_BASEDIR="$BUILD_DIR"
          ccache -M 30G || true
          ccache -z || true

          timeout "${BUILD_TIMEOUT_MIN}m" brunch "$DEVICE" || echo "BUILD_INCOMPLETE_OR_TIMEUP"

          echo "===== CCACHE STATS ====="
          ccache -s || true

      - name: Disk usage after build
        if: always()
        run: df -h /mnt/build

      # ============ STEP 7: Save ccache for next run (always, even on failure/timeout) ============
      - name: Upload ccache to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Packing ccache..."
          tar -czf /tmp/ccache.tar.gz -C "$CCACHE_DIR" .
          ls -lh /tmp/ccache.tar.gz
          split -b 1900M /tmp/ccache.tar.gz /tmp/ccache-part-

          # Delete old release/tag if exists, then recreate
          gh release delete "$CCACHE_RELEASE_TAG" --repo "${{ github.repository }}" --yes 2>/dev/null || true
          git push --delete origin "$CCACHE_RELEASE_TAG" 2>/dev/null || true

          gh release create "$CCACHE_RELEASE_TAG" /tmp/ccache-part-* \
            --repo "${{ github.repository }}" \
            --title "crDroid ccache backup (phoenix)" \
            --notes "Auto-updated ccache backup. Restored automatically on next run."

      # ============ STEP 8: Upload final zip if build completed ============
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crdroid-phoenix-output
          path: |
            /mnt/build/crdroid/out/target/product/*/crDroid*.zip
          if-no-files-found: warn
          retention-days: 7
